<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0E1540"/>
      <stop offset="100%" style="stop-color:#1B2A6B"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#E0357A;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#E0357A;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Left magenta accent bar -->
  <rect x="80" y="80" width="5" height="80" rx="3" fill="#E0357A"/>

  <!-- Logo wordmark -->
  <text x="104" y="147" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72" letter-spacing="-2">
    <tspan fill="#FFFFFF">Cred</tspan><tspan fill="#E0357A">Ramp</tspan>
  </text>

  <!-- Ramp underline triangle -->
  <polygon points="104,162 460,152 460,162" fill="#E0357A"/>

  <!-- Main headline -->
  <text x="80" y="300" font-family="Georgia, serif" font-style="italic" font-weight="900" font-size="68" fill="#FFFFFF" letter-spacing="-1.5">Earn rewards on rent,</text>
  <text x="80" y="378" font-family="Georgia, serif" font-style="italic" font-weight="900" font-size="68" fill="#FFFFFF" letter-spacing="-1.5">childcare &amp; bills.</text>

  <!-- Subtext -->
  <text x="80" y="448" font-family="Arial, sans-serif" font-size="30" fill="rgba(205,215,240,0.9)" letter-spacing="0">Pay by card. Your recipient gets a bank transfer.</text>

  <!-- Pill badge -->
  <rect x="80" y="500" width="320" height="52" rx="26" fill="#E0357A"/>
  <text x="240" y="532" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Join the waitlist</text>

  <!-- Domain -->
  <text x="1120" y="590" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.4)" text-anchor="end">www.credramp.co</text>

  <!-- Decorative dots -->
  <circle cx="1050" cy="120" r="140" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="1050" cy="120" r="200" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <circle cx="1050" cy="120" r="260" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
</svg>
